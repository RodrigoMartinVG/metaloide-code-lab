<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forja | Sandbox Lab</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-panel: #161b22;
            --border: #30363d;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent: #58a6ff;
            --success: #3fb950;
            --error: #f85149;
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- DAG Sidebar --- */
        .sidebar {
            width: 250px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .logo {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid var(--border);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .dag-node {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        .dag-node:hover { background-color: var(--border); }
        .dag-node.active { border-left: 4px solid var(--accent); background-color: rgba(88, 166, 255, 0.1); }
        .dag-node.locked { opacity: 0.5; cursor: not-allowed; }
        
        .node-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; }
        .node-status { font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-dim); }
        .status-pass { color: var(--success); }

        /* --- Main Editor Area --- */
        .main-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            height: 50px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background-color: var(--bg-dark);
        }

        .btn-run {
            background-color: var(--success);
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-run:hover { opacity: 0.8; }
        .btn-run:active { transform: scale(0.98); }

        .editor-container {
            flex: 1;
            position: relative;
        }

        textarea.code-editor {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: #e6edf3;
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.5;
            padding: 20px;
            border: none;
            resize: none;
            outline: none;
            tab-size: 4;
        }

        /* --- Output/Visualizer Area --- */
        .output-pane {
            width: 400px;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background-color: var(--bg-panel);
        }

        .panel-header {
            padding: 10px 20px;
            font-size: 0.8rem;
            font-family: var(--font-mono);
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-dark);
        }

        .terminal {
            flex: 1;
            padding: 20px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            overflow-y: auto;
            border-bottom: 1px solid var(--border);
        }

        .terminal-line { margin-bottom: 8px; }
        .sys-msg { color: var(--text-dim); }
        .err-msg { color: var(--error); }
        .ok-msg { color: var(--success); }

        .visualizer {
            height: 250px;
            padding: 20px;
            background-color: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-dim);
            position: relative;
        }

        /* Fake AST Nodes styling */
        .ast-tree { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        .ast-node { border: 1px solid var(--border); padding: 5px 10px; border-radius: 4px; background: var(--bg-panel); color: var(--accent);}
        .ast-children { display: flex; gap: 20px; margin-top: 5px; }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">FORJA_</div>
        
        <div class="dag-node">
            <div class="node-title">Rust: Ownership</div>
            <div class="node-status status-pass">[✓] TESTS PASSED</div>
        </div>
        
        <div class="dag-node active">
            <div class="node-title">Compilers: Lexer</div>
            <div class="node-status">[ ] IN PROGRESS</div>
        </div>
        
        <div class="dag-node locked">
            <div class="node-title">Compilers: Parser</div>
            <div class="node-status">[!] LOCKED</div>
        </div>

        <div class="dag-node locked">
            <div class="node-title">OS: Context Switch</div>
            <div class="node-status">[!] LOCKED</div>
        </div>
    </div>

    <div class="main-pane">
        <div class="toolbar">
            <div style="font-family: var(--font-mono); color: var(--text-dim); font-size: 0.9rem;">
                ~/forja/labs/compilers/01_lexer/src/main.rs
            </div>
            <button class="btn-run" id="runBtn">$ cargo run</button>
        </div>
        <div class="editor-container">
            <textarea class="code-editor" id="codeEditor" spellcheck="false">
fn main() {
    let source = "let x = 42;";
    let mut lexer = Lexer::new(source);
    
    // Implement the logic to extract tokens
    let tokens = lexer.tokenize();
    
    println!("{:#?}", tokens);
}</textarea>
        </div>
    </div>

    <div class="output-pane">
        <div class="panel-header">TERMINAL OUTPUT</div>
        <div class="terminal" id="terminal">
            <div class="terminal-line sys-msg">Forja backend ready. Waiting for execution...</div>
        </div>
        
        <div class="panel-header">AST / TOKEN VISUALIZER (Rayos X)</div>
        <div class="visualizer" id="visualizer">
            [Visualización Inactiva]
        </div>
    </div>

    <script>
        const runBtn = document.getElementById('runBtn');
        const terminal = document.getElementById('terminal');
        const visualizer = document.getElementById('visualizer');
        const editor = document.getElementById('codeEditor');

        runBtn.addEventListener('click', () => {
            // 1. Limpiar terminal y UI
            terminal.innerHTML = '<div class="terminal-line sys-msg">Compiling lab_lexer v0.1.0...</div>';
            visualizer.innerHTML = '<div class="ast-tree"><span class="sys-msg">Analizando memoria/tokens...</span></div>';
            runBtn.disabled = true;
            runBtn.style.opacity = '0.5';

            // 2. Simular el delay de compilación de Rust
            setTimeout(() => {
                const code = editor.value;
                
                // Un chequeo muy simple para la demo: verificar si el usuario borró o cambió algo clave
                if (code.includes('lexer.tokenize()')) {
                    // Éxito
                    terminal.innerHTML += `
                        <div class="terminal-line sys-msg">Finished dev [unoptimized + debuginfo] target(s) in 0.82s</div>
                        <div class="terminal-line sys-msg">Running \`target/debug/lab_lexer\`</div>
                        <div class="terminal-line"></div>
                        <div class="terminal-line">[</div>
                        <div class="terminal-line">  Token { kind: Keyword(Let), span: 0..3 },</div>
                        <div class="terminal-line">  Token { kind: Identifier("x"), span: 4..5 },</div>
                        <div class="terminal-line">  Token { kind: Assign, span: 6..7 },</div>
                        <div class="terminal-line">  Token { kind: Integer(42), span: 8..10 },</div>
                        <div class="terminal-line">  Token { kind: Semicolon, span: 10..11 },</div>
                        <div class="terminal-line">]</div>
                        <br>
                        <div class="terminal-line ok-msg">Result: Benchmark passed (Memory footprint: 24 bytes).</div>
                    `;

                    // Renderizar AST / Tokens fakes en el visualizador
                    visualizer.innerHTML = `
                        <div class="ast-tree">
                            <div class="ast-node" style="border-color: #8b949e; color: #c9d1d9;">Source: "let x = 42;"</div>
                            <div style="width: 2px; height: 15px; background: #30363d;"></div>
                            <div class="ast-children">
                                <div class="ast-node">Keyword(Let)</div>
                                <div class="ast-node">Id("x")</div>
                                <div class="ast-node">Assign</div>
                                <div class="ast-node">Int(42)</div>
                            </div>
                        </div>
                    `;
                } else {
                    // Error simulado
                    terminal.innerHTML += `
                        <div class="terminal-line err-msg">error[E0425]: cannot find function \`tokenize\` in this scope</div>
                        <div class="terminal-line"> --> src/main.rs:6:24</div>
                        <div class="terminal-line">  |</div>
                        <div class="terminal-line">6 |     let tokens = lexer.tokenize();</div>
                        <div class="terminal-line">  |                        ^^^^^^^^ not found in \`Lexer\`</div>
                        <br>
                        <div class="terminal-line err-msg">error: aborting due to previous error</div>
                    `;
                    visualizer.innerHTML = '<div style="color: var(--error);">[!] Failed to generate Abstract Syntax Tree</div>';
                }

                runBtn.disabled = false;
                runBtn.style.opacity = '1';
                
                // Scroll terminal al fondo
                terminal.scrollTop = terminal.scrollHeight;

            }, 800); // 800ms delay para simular el servidor
        });

        // Permitir usar la tecla Tab en el textarea sin salir del foco
        editor.addEventListener('keydown', function(e) {
            if (e.key == 'Tab') {
                e.preventDefault();
                var start = this.selectionStart;
                var end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });
    </script>
</body>
</html>
